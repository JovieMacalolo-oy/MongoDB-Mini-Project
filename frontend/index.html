<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="p-4 md:p-12">

    <div class="max-w-5xl mx-auto">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Daily Activity Log</h1>
            <p class="text-slate-500">Track your activities and see your progress</p>
        </header>

        <div id="level-container" class="level-system-container bg-white p-6 rounded-[2rem] shadow-sm mb-10">
            <div class="flex justify-between text-[10px] font-bold text-emerald-600 mb-2 uppercase tracking-widest">
                <span id="playerLevel">Level 1</span>
                <span id="xpToNext">0 / 100 XP</span>
                <span>Level UP</span>
            </div>
            <div class="level-progress-bar">
                <div id="levelBar" class="level-progress-fill" style="width: 0%"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="stat-card p-8 rounded-[2rem] text-center">
                <h3 id="stat-label-1" class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Total XP</h3>
                <p id="totalXP" class="text-4xl font-bold text-slate-800">0</p>
            </div>
            <div class="stat-card p-8 rounded-[2rem] text-center">
                <h3 id="stat-label-2" class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Quests Done</h3>
                <p id="completedCount" class="text-4xl font-bold text-slate-800">0</p>
            </div>
            <div class="stat-card p-8 rounded-[2rem]">
                <h3 id="category-title" class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Category Split</h3>
                <div id="category-list" class="space-y-2 text-sm"></div>
            </div>
        </div>

        <div class="flex flex-col md:flex-row gap-4 mb-8 items-center justify-between bg-white p-4 rounded-[2rem] shadow-sm">
    <div class="relative w-full md:w-80">
        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
            🔍
        </span>
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search activities..." 
            class="w-full pl-11 pr-4 py-3 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm transition-all"
        >
    </div>

    <button 
        onclick="downloadBackup()" 
        class="w-full md:w-auto flex items-center justify-center gap-2 px-6 py-3 bg-slate-800 text-white rounded-2xl hover:bg-slate-700 transition-all text-sm font-bold shadow-lg"
    >
        <span>📥</span> Export JSON Backup
    </button>
</div>

        <div class="flex justify-center gap-8 mb-10 border-b border-slate-200">
            <button id="btn-sidequest" onclick="showTab('sidequest')" class="tab-btn active pb-4 font-bold">Sidequests</button>
            <button id="btn-academic" onclick="showTab('academic')" class="tab-btn pb-4 font-bold">Academics</button>
            <button id="btn-extra" onclick="showTab('extra')" class="tab-btn pb-4 font-bold">Extracurricular</button>
        </div>

        <div id="card-container" class="space-y-4 pb-24"></div>
    </div>

    <button onclick="openModal()" class="fixed bottom-8 right-8 bg-emerald-600 text-white w-16 h-16 rounded-full text-3xl shadow-2xl z-50 hover:scale-110 transition">+</button>

    <div id="addModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[100]">
        <div class="bg-white p-8 rounded-[2.5rem] max-w-md w-full mx-4">
            <h2 id="modalTitle" class="text-2xl font-bold mb-6">New Entry</h2>
            <form id="taskForm" class="space-y-4">
                <input type="hidden" id="editItemId">
                
                <div id="sidequestFields" class="space-y-4">
                    <input type="text" id="questTitle" placeholder="Quest Name" class="w-full p-3 border rounded-xl">
                    <select id="taskCategory" class="w-full p-3 border rounded-xl">
                        <option value="wellness">Wellness</option>
                        <option value="exploration">Exploration</option>
                        <option value="social">Social</option>
                    </select>
                    <input type="number" id="taskDifficulty" placeholder="Difficulty (1-5)" class="w-full p-3 border rounded-xl">
                </div>

                <div id="academicFields" class="hidden space-y-4">
                    <input type="text" id="acadSubject" placeholder="Subject" class="w-full p-3 border rounded-xl">
                    <input type="date" id="acadDeadline" class="w-full p-3 border rounded-xl">
                    <textarea id="acadNote" placeholder="Notes" class="w-full p-3 border rounded-xl"></textarea>
                </div>

                <div id="extraFields" class="hidden space-y-4">
                    <input type="text" id="extraOrg" placeholder="Organization" class="w-full p-3 border rounded-xl">
                    <input type="text" id="extraTask" placeholder="Task Name" class="w-full p-3 border rounded-xl">
                    <input type="date" id="extraDeadline" class="w-full p-3 border rounded-xl">
                    <textarea id="extraNote" placeholder="Notes" class="w-full p-3 border rounded-xl"></textarea>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 py-3 rounded-xl font-bold">Cancel</button>
                    <button type="submit" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
